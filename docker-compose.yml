# AI Pharmacy OS — local development stack (Sprint 2).
# Brings up Postgres (with pgvector) + Redis. The backend image is provided but
# commented until the app is wired against a live DB in Sprint 3.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pharma
      POSTGRES_PASSWORD: pharma
      POSTGRES_DB: pharmacy_os
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma -d pharmacy_os"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: ../infra/docker/backend.Dockerfile
  #   env_file: ./backend/.env
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis: { condition: service_healthy }
  #   ports:
  #     - "8000:8000"

volumes:
  postgres-data:
  redis-data:
