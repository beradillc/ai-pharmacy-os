[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payment_vnpay"
version = "0.1.0"
description = "VNPAY payment gateway plugin for AI Pharmacy OS (Sprint 8 mục 4/4)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

# docs/09 mục 4: a plugin depends only on pharmacy_os.core.plugins (the contract),
# never on pharmacy_os.modules or the rest of pharmacy_os.core. This package does
# not declare pharmacy-os as a dependency at all — the contract types it imports
# are available because both packages are installed editable in the same venv
# during development; a real deployment installs pharmacy-os as the app and this
# as one of its plugins, not the other way around.

[project.entry-points."pharmacy_os.plugins"]
vnpay = "payment_vnpay.plugin:VNPayPlugin"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
