[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pharmacy-os"
version = "0.2.0"
description = "AI Pharmacy OS — AI-native pharmacy operating system (kernel skeleton)"
requires-python = ">=3.12"
readme = "../README.md"
license = "Apache-2.0"
license-files = ["../LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",  # sync driver used by Alembic migrations
    "pgvector>=0.3",
    "redis>=5.0",
    "structlog>=24.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "tenacity>=8.3",
    "httpx>=0.27",
    "reportlab>=4.2",
]

[project.optional-dependencies]
ai = ["anthropic>=0.34"]
worker = ["celery>=5.4"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "coverage>=7.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pharmacy_os"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
packages = ["pharmacy_os"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["celery.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.coverage.run]
source = ["pharmacy_os"]
branch = true
