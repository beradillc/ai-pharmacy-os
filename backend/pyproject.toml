[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pharmacy-os"
version = "0.2.0"
description = "AI Pharmacy OS — AI-native pharmacy operating system (kernel skeleton)"
requires-python = ">=3.12"
readme = "../README.md"
license = "Apache-2.0"
license-files = ["../LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",  # sync driver used by Alembic migrations
    "pgvector>=0.3",
    "redis>=5.0",
    "structlog>=24.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    # TOTP (RFC 6238) for 2FA on high-trust roles — Sprint 8. Standard implementation
    # rather than hand-rolled HMAC: see core/security/totp.py for the reasoning.
    "pyotp>=2.9",
    # AES-256-GCM for at-rest field encryption — Sprint 8. The one primitive in this
    # project that must never be hand-rolled: an AEAD mistake is silent and total.
    "cryptography>=42",
    "tenacity>=8.3",
    "httpx>=0.27",
    "reportlab>=4.2",
]

[project.optional-dependencies]
ai = ["anthropic>=0.34"]
worker = ["celery>=5.4"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "coverage>=7.5",
    "types-reportlab>=4.2",
    # starlette.testclient prefers this over httpx (StarletteDeprecationWarning otherwise);
    # only used by TestClient in tests, not by app code.
    "httpx2>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pharmacy_os"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
# `seeds` thêm 2026-07-26 (audit P0-04 / F-1): seeds/ nằm ngoài cổng mypy suốt 209 commit,
# trong khi seeds/encrypt_backfill.py là script GHI ĐÈ dữ liệu bệnh nhân thật bằng bản mã —
# sai ở đó là mất dữ liệu vĩnh viễn, không revert được.
# Nợ còn lại: `tests/` vẫn ngoài phạm vi (109 lỗi strict) — việc riêng, không gộp vào F-1.
packages = ["pharmacy_os", "seeds"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["celery.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
# KHÔNG đặt addopts = "-q" (gỡ 2026-07-26, audit P0-01 / F-1b).
# `-q` ở đây cộng với `-q` gõ thêm ở dòng lệnh thành `-qq`, mà `-qq` bỏ HẲN dòng tổng kết
# "N passed" — đúng dòng mà quy trình tự kiểm chứng §7az bảo phải đọc. Quy trình chống
# báo-xanh-vô-căn-cứ tự nó hỏng lặng lẽ ngay tại chỗ nó vừa được dựng lên.

[tool.coverage.run]
source = ["pharmacy_os"]
branch = true
